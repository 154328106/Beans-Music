name: Build Test IPA

on:
  push:
    branches: [v134-features]

permissions:
  contents: read

jobs:
  build-ipa:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project Beans.xcodeproj \
            -scheme Beans \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Beans.app Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload Beans-1.4.0-test.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Beans-1.4.0-test-ipa
          path: Beans-1.4.0-test.ipa
